# Istio Gateway that fronts the llm-d InferencePool(s). Exposed as a NodePort (no LB IP pool in the lab).
# Tested: Istio 1.28.3, Oct 2026.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference-gateway
  namespace: llm
  annotations:
    networking.istio.io/service-type: NodePort
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
