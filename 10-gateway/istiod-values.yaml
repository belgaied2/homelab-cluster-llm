# istiod for a gateway-only Istio with Gateway API Inference Extension support.
# Tested: istiod 1.28.3 (the version Kaito documents as tested with GWIE), Oct 2026.
pilot:
  env:
    ENABLE_GATEWAY_API_INFERENCE_EXTENSION: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
global:
  proxy:
    resources:
      requests:
        cpu: 50m
